const storageKey = "watched-pkm";
const lastEpisodeKey = "last-pkm";
let currentEpisode = null;

const episodeList = document.getElementById("episode-list");

episodes.forEach(function(episode) {
  const button = document.createElement("button");
  button.className = "episode";
  button.dataset.number = episode.number;
  button.textContent = String(episode.number).padStart(2);    
  button.onclick = function() {
    playEpisode(episode.number);
  };
  episodeList.appendChild(button);
});

function playEpisode(number) {
  const episode = episodes.find(function(item) {
    return item.number === number;
  });

  if (!episode) return;

  currentEpisode = number;
  document.getElementById("player").src = episode.url;

  localStorage.setItem(lastEpisodeKey, String(number));
  saveWatched(number);
  updateButtons();
  updateNavigation();

  String(number).padStart(2);
}

function saveWatched(number) {
  let watched = JSON.parse(localStorage.getItem(storageKey)) || [];

  if (!watched.includes(number)) {
    watched.push(number);
  }

  localStorage.setItem(storageKey, JSON.stringify(watched));
}

function updateButtons() {
  const watched = JSON.parse(localStorage.getItem(storageKey)) || [];
  const buttons = document.querySelectorAll(".episode");

  buttons.forEach(function(button) {
    const number = Number(button.dataset.number);
    button.classList.remove("active", "watched");

    if (number === currentEpisode) {
      button.classList.add("active");+ String(number).padStart(2);
    } else if (watched.includes(number)) {
      button.classList.add("watched"); + String(number).padStart(2);
    } else {
      button.textContent = String(number).padStart(2);
    }
  });
}

function nextEpisode() {
  if (currentEpisode === null) {
    playEpisode(episodes[0].number);
    return;
  }

  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });

  if (index >= 0 && index < episodes.length - 1) {
    playEpisode(episodes[index + 1].number);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function previousEpisode() {
  if (currentEpisode === null) return;

  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });

  if (index > 0) {
    playEpisode(episodes[index - 1].number);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function updateNavigation() {
  const current = document.getElementById("currentEpisode");
  const previous = document.getElementById("prevEpisode");
  const next = document.getElementById("nextEpisode");


  if (currentEpisode === null) {
    current.textContent = "";
    previous.disabled = true;
    next.disabled = false;
    return;
  }


  const episode = episodes.find(function(item) {
    return item.number === currentEpisode;
  });


  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });
  
  
     <!-- Xoá cái này nếu không nhập tên tập -->
current.textContent = episode.title;

     
  previous.disabled = index <= 0;
  next.disabled = index >= episodes.length - 1;
}

function restoreHistory() {
  const saved = Number(localStorage.getItem(lastEpisodeKey));

  if (saved && episodes.some(function(item) { return item.number === saved; })) {
    currentEpisode = saved;
    document.getElementById("player").src =
      episodes.find(function(item) { return item.number === saved; }).url;
  }
updateButtons();
  updateNavigation();

  if (currentEpisode !== null) {
    const episode = episodes.find(function(item) {
      return item.number === currentEpisode;
    });
String(currentEpisode).padStart(2)
  }
}

restoreHistory();

/* ====== MENU NGĂN KÉO ====== */
var menuToggle = document.getElementById("menuToggle");
var drawer = document.getElementById("drawer");
var drawerOverlay = document.getElementById("drawerOverlay");

function openDrawer() {
    drawer.classList.add("open");
    drawerOverlay.classList.add("open");
    menuToggle.classList.add("open");
    menuToggle.setAttribute("aria-expanded", "true");
    drawer.setAttribute("aria-hidden", "false");
}

function closeDrawer() {
    drawer.classList.remove("open");
    drawerOverlay.classList.remove("open");
    menuToggle.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    drawer.setAttribute("aria-hidden", "true");
}

menuToggle.addEventListener("click", function () {
    if (drawer.classList.contains("open")) {
        closeDrawer();
    } else {
        openDrawer();
    }
});

drawerOverlay.addEventListener("click", closeDrawer);

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
});

/* ====== CÔNG TẮC GIAO DIỆN SÁNG / TỐI / AMOLED ====== */
var themeButtons = document.querySelectorAll("#themeSwitch button");

function refreshThemeButtons() {
    var current = document.documentElement.getAttribute("data-theme") || "dark";
    themeButtons.forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.themeChoice === current);
    });
}

themeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
        var choice = btn.dataset.themeChoice;
        document.documentElement.setAttribute("data-theme", choice);
        localStorage.setItem("site-theme", choice);
        refreshThemeButtons();
    });
});

refreshThemeButtons();
