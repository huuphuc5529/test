<!DOCTYPE html>
<html lang="vi">
<head>
<script>
/* Đọc giao diện đã lưu TRƯỚC khi trang vẽ ra, để không bị nháy sáng/tối */
(function () {
    var saved = localStorage.getItem("site-theme") || "dark";
    document.documentElement.setAttribute("data-theme", saved);
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/style.css">
<title>AnimeVSub</title>
</head>
<body>

<header>
  <div class="header-left">
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="Mở menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
  <a href="/index.html" class="back">← Trang chủ</a>
</header>

<!-- Menu ngăn kéo bên trái -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <a href="/index.html" class="drawer-brand">
    <img src="/img/logo.png">
    <span>AnimeVSub</span>
  </a>

  <nav class="drawer-nav">
    <a href="/index.html" class="drawer-link">Trang chủ</a>
  </nav>

  <div class="drawer-section">
    <p class="drawer-label">Giao diện</p>
    <div class="theme-switch" id="themeSwitch">
      <button type="button" data-theme-choice="light"><span class="icon">☀️</span>Sáng</button>
      <button type="button" data-theme-choice="dark"><span class="icon">🌙</span>Tối</button>
      <button type="button" data-theme-choice="amoled"><span class="icon">⚫</span>AMOLED</button>
    </div>
  </div>
</aside>

<main>

  <div class="page-heading">
    <h2>Hội Chứng Tuổi Thanh Xuân: Em Gái Xuất Hành</h2>
<p>Seishun Buta Yarou wa Odekake Sister no Yume wo Minai, Rascal Does Not Dream of a Sister Venturing Out, Bunny Girl Senpai Movie 2</p>
  </div>

  <div class="player">
    <iframe id="player" src="" allowfullscreen></iframe>
  </div>

  <section class="episodes">
    <h2>Chọn bản chiếu</h2>
    <div id="episode-list" class="episode-list"></div>
  </section>
</main>

<footer class="site-footer">
    © AnimeVSub
</footer>

<script>
/* Mỗi bản chiếu: number = mã định danh nội bộ (không hiện ra),
   title = CHỮ sẽ hiện trên nút (vd: "Vietsub", "Thuyết minh", "Full HD"...) */
const episodes = [

    { number: 1, title: "Vietsub", url: "https://player.abyssplayer.com/G6HT5LLfB" },

];
const lastEpisodeKey = "last-tenki-no-ko";
let currentEpisode = null;

const episodeList = document.getElementById("episode-list");

episodes.forEach(function(episode) {
  const button = document.createElement("button");
  button.className = "episode";
  button.dataset.number = episode.number;
  button.textContent = episode.title || ("Bản " + episode.number);
  button.onclick = function() {
    playEpisode(episode.number);
  };
  episodeList.appendChild(button);
});

function playEpisode(number) {
  const episode = episodes.find(function(item) {
    return item.number === number;
  });

  if (!episode) return;

  currentEpisode = number;
  document.getElementById("player").src = episode.url;

  localStorage.setItem(lastEpisodeKey, String(number));
  updateButtons();
}

function updateButtons() {
  const buttons = document.querySelectorAll(".episode");

  buttons.forEach(function(button) {
    const number = Number(button.dataset.number);
    const episode = episodes.find(function(item) { return item.number === number; });
    const label = episode.title || ("Bản " + number);

    button.classList.remove("active");

    if (number === currentEpisode) {
      button.classList.add("active");
      button.textContent = "▶ " + label;
    } else {
      button.textContent = label;
    }
  });
}

function restoreHistory() {
  const saved = Number(localStorage.getItem(lastEpisodeKey));

  if (saved && episodes.some(function(item) { return item.number === saved; })) {
    currentEpisode = saved;
    document.getElementById("player").src =
      episodes.find(function(item) { return item.number === saved; }).url;
  } else if (episodes.length) {
    /* Tự động phát bản đầu tiên khi vào trang */
    currentEpisode = episodes[0].number;
    document.getElementById("player").src = episodes[0].url;
  }

  updateButtons();
}

restoreHistory();

/* ====== MENU NGĂN KÉO ====== */
var menuToggle = document.getElementById("menuToggle");
var drawer = document.getElementById("drawer");
var drawerOverlay = document.getElementById("drawerOverlay");

function openDrawer() {
    drawer.classList.add("open");
    drawerOverlay.classList.add("open");
    menuToggle.classList.add("open");
    menuToggle.setAttribute("aria-expanded", "true");
    drawer.setAttribute("aria-hidden", "false");
}

function closeDrawer() {
    drawer.classList.remove("open");
    drawerOverlay.classList.remove("open");
    menuToggle.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    drawer.setAttribute("aria-hidden", "true");
}

menuToggle.addEventListener("click", function () {
    if (drawer.classList.contains("open")) {
        closeDrawer();
    } else {
        openDrawer();
    }
});

drawerOverlay.addEventListener("click", closeDrawer);

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
});

/* ====== CÔNG TẮC GIAO DIỆN SÁNG / TỐI / AMOLED ====== */
var themeButtons = document.querySelectorAll("#themeSwitch button");

function refreshThemeButtons() {
    var current = document.documentElement.getAttribute("data-theme") || "dark";
    themeButtons.forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.themeChoice === current);
    });
}

themeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
        var choice = btn.dataset.themeChoice;
        document.documentElement.setAttribute("data-theme", choice);
        localStorage.setItem("site-theme", choice);
        refreshThemeButtons();
    });
});

refreshThemeButtons();
</script>

</body>
</html>
