const storageKey = "watched-pkm-s1";
const lastEpisodeKey = "last-pkm-s1";
const serverKey = "server-pkm-s1";
let currentEpisode = null;

/* Danh sách server xem phim.
   name = tên nội bộ, label = chữ hiện trên nút.
   Muốn thêm link riêng cho từng server ở 1 tập cụ thể,
   thêm field "servers: { FB: '...', HDX: '...' }" vào tập đó trong mảng episodes ở trên.
   Nếu tập không có link riêng cho server đang chọn, trang sẽ tự dùng lại link "url" mặc định (server DU). */
const servers = [
  { name: "H", label: "H" }
];
let currentServer = localStorage.getItem(serverKey) || servers[0].name;

const episodeList = document.getElementById("episode-list");
const serverListEl = document.getElementById("server-list");

servers.forEach(function(server) {
  const button = document.createElement("button");
  button.className = "server-btn";
  button.dataset.server = server.name;
  button.textContent = server.label;
  button.onclick = function() {
    selectServer(server.name);
  };
  serverListEl.appendChild(button);
});

function getEpisodeUrl(episode, server) {
  if (episode.servers && episode.servers[server]) {
    return episode.servers[server];
  }
  return episode.url;
}

function selectServer(server) {
  currentServer = server;
  localStorage.setItem(serverKey, server);
  updateServerButtons();

  if (currentEpisode !== null) {
    const episode = episodes.find(function(item) {
      return item.number === currentEpisode;
    });
    if (episode) {
      document.getElementById("player").src = getEpisodeUrl(episode, currentServer);
    }
  }
}

function updateServerButtons() {
  const buttons = document.querySelectorAll(".server-btn");
  buttons.forEach(function(button) {
    button.classList.toggle("active", button.dataset.server === currentServer);
  });
}

episodes.forEach(function(episode) {
  const button = document.createElement("button");
  button.className = "episode";
  button.dataset.number = episode.number;
  button.textContent = String(episode.number).padStart(2);    
  button.onclick = function() {
    playEpisode(episode.number);
  };
  episodeList.appendChild(button);
});

function playEpisode(number) {
  const episode = episodes.find(function(item) {
    return item.number === number;
  });

  if (!episode) return;

  currentEpisode = number;
  document.getElementById("player").src = getEpisodeUrl(episode, currentServer);

  localStorage.setItem(lastEpisodeKey, String(number));
  saveWatched(number);
  updateButtons();
  updateNavigation();

  String(number).padStart(2);
}

function saveWatched(number) {
  let watched = JSON.parse(localStorage.getItem(storageKey)) || [];

  if (!watched.includes(number)) {
    watched.push(number);
  }

  localStorage.setItem(storageKey, JSON.stringify(watched));
}

function updateButtons() {
  const watched = JSON.parse(localStorage.getItem(storageKey)) || [];
  const buttons = document.querySelectorAll(".episode");

  buttons.forEach(function(button) {
    const number = Number(button.dataset.number);
    button.classList.remove("active", "watched");

    if (number === currentEpisode) {
      button.classList.add("active");
    } else if (watched.includes(number)) {
      button.classList.add("watched");
    }
    button.textContent = String(number).padStart(2);
  });
}

function nextEpisode() {
  if (currentEpisode === null) {
    playEpisode(episodes[0].number);
    return;
  }

  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });

  if (index >= 0 && index < episodes.length - 1) {
    playEpisode(episodes[index + 1].number);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function previousEpisode() {
  if (currentEpisode === null) return;

  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });

  if (index > 0) {
    playEpisode(episodes[index - 1].number);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function updateNavigation() {
  const current = document.getElementById("currentEpisode");
  const previous = document.getElementById("prevEpisode");
  const next = document.getElementById("nextEpisode");


  if (currentEpisode === null) {
    current.textContent = "";
    previous.disabled = true;
    next.disabled = false;
    return;
  }


  const episode = episodes.find(function(item) {
    return item.number === currentEpisode;
  });


  const index = episodes.findIndex(function(item) {
    return item.number === currentEpisode;
  });
  
  
     <!-- Xoá cái này nếu không nhập tên tập -->
current.textContent = episode.title;

     
  previous.disabled = index <= 0;
  next.disabled = index >= episodes.length - 1;
}

function restoreHistory() {
  const saved = Number(localStorage.getItem(lastEpisodeKey));

  if (saved && episodes.some(function(item) { return item.number === saved; })) {
    currentEpisode = saved;
    const savedEpisode = episodes.find(function(item) { return item.number === saved; });
    document.getElementById("player").src = getEpisodeUrl(savedEpisode, currentServer);
  }
updateButtons();
  updateNavigation();
  updateServerButtons();

  if (currentEpisode !== null) {
    const episode = episodes.find(function(item) {
      return item.number === currentEpisode;
    });
String(currentEpisode).padStart(2)
  }
}

restoreHistory();

/* ====== MENU NGĂN KÉO ====== */
var menuToggle = document.getElementById("menuToggle");
var drawer = document.getElementById("drawer");
var drawerOverlay = document.getElementById("drawerOverlay");

function openDrawer() {
    drawer.classList.add("open");
    drawerOverlay.classList.add("open");
    menuToggle.classList.add("open");
    menuToggle.setAttribute("aria-expanded", "true");
    drawer.setAttribute("aria-hidden", "false");
}

function closeDrawer() {
    drawer.classList.remove("open");
    drawerOverlay.classList.remove("open");
    menuToggle.classList.remove("open");
    menuToggle.setAttribute("aria-expanded", "false");
    drawer.setAttribute("aria-hidden", "true");
}

menuToggle.addEventListener("click", function () {
    if (drawer.classList.contains("open")) {
        closeDrawer();
    } else {
        openDrawer();
    }
});

drawerOverlay.addEventListener("click", closeDrawer);

document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDrawer();
});
